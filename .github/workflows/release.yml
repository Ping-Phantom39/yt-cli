name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux Build Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev gcc-aarch64-linux-gnu

      - name: Build yt-player
        shell: bash
        run: |
          cd yt-player
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -v -o "../ytplayer-${{ matrix.os }}-${{ matrix.arch }}$EXT" main.go

      - name: Build yt-song
        shell: bash
        run: |
          cd yt-song
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -v -o "../ytmusic-${{ matrix.os }}-${{ matrix.arch }}$EXT" main.go

      - name: Archive Binaries
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          
          YTPLAYER_BIN="ytplayer-${{ matrix.os }}-${{ matrix.arch }}$EXT"
          YTMUSIC_BIN="ytmusic-${{ matrix.os }}-${{ matrix.arch }}$EXT"

          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a "dist/ytplayer-${{ matrix.os }}-${{ matrix.arch }}.zip" "$YTPLAYER_BIN"
            7z a "dist/ytmusic-${{ matrix.os }}-${{ matrix.arch }}.zip" "$YTMUSIC_BIN"
          else
            tar -czvf "dist/ytplayer-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "$YTPLAYER_BIN"
            tar -czvf "dist/ytmusic-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "$YTMUSIC_BIN"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binaries-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
